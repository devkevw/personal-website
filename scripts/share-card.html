<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Poppins:wght@600&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #e1dcd0;
      color: #32302f;
    }
    h1 {
      margin: 0;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 128px;
      line-height: 1;
      letter-spacing: -0.06em;
    }
    h1 span { color: #52644d; }
    p {
      margin: 34px 0 0;
      font-family: Inter, sans-serif;
      font-weight: 500;
      font-size: 38px;
      letter-spacing: -0.03em;
      color: #68635e;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>kevinjwang<span>.</span>xyz</h1>
    <p>a guy with a website</p>
  </div>
</body>
</html>
