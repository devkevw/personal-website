<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: Poppins; font-style: normal; font-weight: 600; font-display: swap; src: url(share-card-assets/fonts/poppins-600.ttf) format('truetype'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f5f3ed;
      color: #32302f;
    }
    .composition { padding-top: 75px; }
    .domain { position: relative; }
    .goat-perch { position: relative; display: inline-block; }
    .goat { position: absolute; width: 160px; height: auto; max-width: none; left: 50%; transform: translateX(-50%); bottom: calc(100% - 40px); }
    h1 {
      margin: 0;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 128px;
      line-height: 1;
      letter-spacing: -0.06em;
    }
    .domain-dot { color: #52644d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="composition">
      <div class="domain">
        <h1>kevinjwan<span class="goat-perch">g<img class="goat" src="share-card-assets/goat-peeking.png" alt="" aria-hidden="true"></span><span class="domain-dot">.</span>xyz</h1>
      </div>
    </div>
  </div>
</body>
</html>
